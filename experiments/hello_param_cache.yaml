# Exemplo com variação: CPU timing, caches L1/L2, DDR4 e flags próprias.
# Todos os campos aparecem aqui; os omitidos em outros arquivos usam o padrão
# indicado no comentário. Referência completa em docs/experiments.md.

# Identificador do experimento (letras, números, _ e -). Obrigatório.
name: hello_param_cache

# Texto livre para lembrar o objetivo. Padrão: vazio.
description: Vetor de 256KiB percorrido 2 vezes, maior que a L1 e igual à L2.

# Cenário de memória nomeado de configs/scenarios.yaml (sem-cache | l1 | l1-l2
# | reduzido), que preenche cache e memory; não use junto com essas seções.
# Este exemplo define cache e memory à mão. Padrão: nenhum.
# scenario: l1-l2

benchmark:
  # Pasta em benchmarks/ com main.c e Makefile. Obrigatório.
  name: hello_riscv_param
  # Argumentos do programa. Para hello_riscv_param: [N, R] = elementos do
  # vetor (4 bytes cada) e repetições. Padrão: [].
  args: ["65536", "2"]
  # Implementação do kernel: ref (referência escalar) | custom (instruções
  # personalizadas, só no gem5 do fork) | rvv (extensão V). Só as operações de
  # CNN têm custom e rvv; hello_riscv_param tem apenas ref. Padrão: ref.
  variant: ref
  # Caches no início da região de interesse: warm (aquecidas pela
  # inicialização dos dados) | cold (o gem5 as esvazia antes da ROI). cold
  # exige caches e um benchmark com ROI; hello_riscv_param não tem. Padrão: warm.
  cache_state: warm

compiler:
  # Flags escolhidas pelo experimento. -static, -march e -mabi são sempre
  # adicionadas pelo Makefile do benchmark (o -march depende da variante).
  # Padrão: ["-O2"].
  flags: ["-O3", "-funroll-loops"]

cpu:
  # atomic | timing | minor (in-order) | o3 (out-of-order, padrão do gem5) |
  # o3-edge (out-of-order estreita, de borda). Padrão: atomic.
  # atomic serve para validação funcional; os demais modelam tempo.
  model: timing
  # Frequência da CPU, em MHz ou GHz. Padrão: 1GHz.
  clock: 2GHz
  # VLEN da extensão V, em bits: 128 | 256 | 512 | 1024. Só afeta a variante
  # rvv. Padrão: 256 (o do gem5).
  vlen: 256
  # Latência, em ciclos, de cnn.dot8, cnn.dwmac e cnn.rqnt[.relu]. Só afeta a
  # variante custom nas CPUs minor, o3 e o3-edge; nas atomic e timing, só o
  # padrão é aceito. Padrão: 3 (a do mul).
  custom_latency: 3

# Cada nível é opcional; omitido = sem aquele cache. Padrão: sem caches.
# size em KiB/MiB/GiB; assoc = associatividade (vias). Padrão de assoc: 4.
# A L2 exige l1i e l1d.
cache:
  l1i:
    size: 32KiB
    assoc: 4
  l1d:
    size: 32KiB
    assoc: 4
  l2:
    size: 256KiB
    assoc: 8

memory:
  # simple (latência fixa) | ddr4 (DDR4-2400 com controlador). Padrão: simple.
  type: ddr4
  # Tamanho da memória simulada. Padrão: 512MiB.
  size: 512MiB

output:
  # Pasta onde cada execução cria sua subpasta <run_id>.
  # Padrão: results/<name>.
  dir: results/hello_param_cache
